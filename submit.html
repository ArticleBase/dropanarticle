<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Article - DropAnArticle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Submit Your Article</h1>
        <form id="articleForm">
            <!-- Article Title -->
            <div class="form-group">
                <label for="title">Article Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <!-- Image Upload Section -->
            <div class="form-group">
                <label for="imageFile">Featured Image</label>
                <input type="file" id="imageFile" accept="image/*">
                
                <!-- Hidden input to store the hosted ImgBB URL -->
                <input type="hidden" id="imageUrl" name="imageUrl">

                <!-- Status & Preview -->
                <div id="uploadStatus" style="margin-top: 10px; font-weight: bold; color: #555;"></div>
                <div id="imagePreviewContainer" style="margin-top: 15px; max-width: 300px;">
                    <!-- Image preview will appear here -->
                </div>
            </div>

            <!-- Article Content -->
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Publish Article</button>
        </form>
    </div>

    <!-- Script -->
    <script src="js/main.js"></script>
</body>
</html>
